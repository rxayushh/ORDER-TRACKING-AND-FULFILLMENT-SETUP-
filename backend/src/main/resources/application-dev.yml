spring:
  datasource:
    url: jdbc:h2:mem:ordertrackingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # Development-only signing key. Set JWT_SECRET for any shared or deployed environment.
    secret: ${JWT_SECRET:dev-only-order-tracking-signing-key-2026-change-before-deployment}
